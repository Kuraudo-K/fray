[package]
name = "fray-disk"
version = "0.1.0"
edition = "2021"
description = "Simple disk/partition viewer (hexagonal)"
license = "MIT"

[lib]
name = "fray_disk"
path = "src/lib.rs"

[[bin]]
name = "fray-disk"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
