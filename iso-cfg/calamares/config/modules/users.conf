---
displayAutologin: true
doAutologin: false

# Afficher le champ hostname (None = ignoré → « Ignoring hostname … »)
hostname:
  forbidden_names: [ localhost, fray-iso ]

defaultGroups:
  - name: networkmanager
    must_exist: false
    system: true
  - name: wheel
    must_exist: false
    system: true
  - name: input
    must_exist: false
    system: true
  - name: render
    must_exist: false
    system: true
  - name: video
    must_exist: false
    system: true

userShell: /run/current-system/sw/bin/bash
